name: Release

# Se ejecuta al empujar un tag "v*" (ej. v0.1.0) o manualmente desde la pestaña Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Mac universal (Apple Silicon + Intel) → .dmg
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Windows → .msi / -setup.exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'BoredPowerMD v__VERSION__'
          releaseBody: 'Descarga el instalador para tu sistema (.dmg para macOS, .msi/.exe para Windows).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
